server {
    listen 80;
    server_name activos.eup.com.mx;
    root /usr/share/nginx/html;

    # Certbot (modo webroot) deja los archivos de verificacion aqui — usado
    # SOLO para obtener el primer certificado. Una vez emitido, se reemplaza
    # este archivo por nginx.conf (que ya incluye HTTPS).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /mesa-de-ayuda {
        try_files $uri /mesa-de-ayuda.html;
    }

    location = /health {
        proxy_pass http://backend:4000/health;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }
    location = /deploy-tags.json {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
