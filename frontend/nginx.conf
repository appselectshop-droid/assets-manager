server {
    listen 80;
    server_name activos.eup.com.mx;

    # Certbot (modo webroot) deja los archivos de verificación aqui — el
    # volumen se monta en docker-compose.yml, compartido con el host.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name activos.eup.com.mx;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/letsencrypt/live/activos.eup.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activos.eup.com.mx/privkey.pem;

    # Mesa de Ayuda es una segunda PWA servida desde el mismo build (ver
    # scripts/generate-mesa-de-ayuda-shell.js) — necesita su propio shell
    # HTML para que el navegador la reconozca como app instalable aparte.
    location /mesa-de-ayuda {
        try_files $uri /mesa-de-ayuda.html;
    }

    # Health check del backend (para monitoreo futuro, ej. un load balancer)
    location = /health {
        proxy_pass http://backend:4000/health;
    }

    # API en el mismo origen — evita CORS, el backend no se expone directo.
    # client_max_body_size: FIX 2026-08-03 — el default de nginx (1MB) se
    # quedó puesto sin querer al migrar a AWS (Vercel/Render, de donde
    # veníamos, nunca tuvieron esta capa de nginx en medio). Con solo 1MB,
    # cualquier captura de pantalla o adjunto de Notas internas (hasta 80MB
    # permitidos por el backend, ver uploadNoteAttachment en tickets.js) se
    # rechazaba aquí mismo, antes de llegar al backend — por eso no quedaba
    # ningún rastro en sus logs. 100M cubre con margen el límite más grande
    # que ya existe en la app (80MB).
    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nunca cachear el HTML shell ni los artefactos de service worker/manifest
    # — si no, el aviso de "hay una versión nueva" (UpdateToast) tarda en
    # aparecer porque el navegador sigue sirviendo el HTML/SW viejo cacheado.
    location ~* \.(?:html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }
    location = /deploy-tags.json {
        add_header Cache-Control "no-store";
    }

    # Assets con hash en el nombre (Vite) — cache largo, son inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback para todo lo demás (React Router).
    location / {
        try_files $uri /index.html;
    }
}
